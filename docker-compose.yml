# Môi trường dev đầy đủ: docker compose up -d
#   FE  http://localhost:5174   (Vite, hot reload)
#   API http://localhost:3000   (tsx watch, hot reload)
#   DB  Supabase (online): đặt DATABASE_URL trong backend/.env (API đọc file này qua env_file).
#       Không có Supabase: docker compose --profile local up -d  (Postgres local) và đặt
#       DATABASE_URL=postgres://postgres:postgres@db:5432/airrest trong backend/.env
services:
  db:
    profiles: ["local"]
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: airrest }
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airrest"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: node:22-alpine
    working_dir: /app
    # Env truyền qua compose nên gọi tsx trực tiếp (script npm đòi file .env). Seed chạy lại an toàn (upsert).
    command: sh -c "npm install && cd backend && npx tsx database/scripts/seed.ts && npx tsx watch api/server.ts"
    env_file: ./backend/.env
    environment:
      NODE_ENV: development
      PORT: "3000"
      JWT_SECRET: dev-only-change-me-please-0123456789
      DATA_ENC_KEY: dev-only-data-key-change-me-0123456789
      CORS_ORIGINS: http://localhost:5174
      SEED_PASSWORD: ChangeMe123!
      VNPAY_ENABLED: "true"
      VNPAY_MODE: mock # chuyển live + điền VNPAY_TMN_CODE/VNPAY_HASH_SECRET khi có khóa
      VNPAY_RETURN_URL: http://localhost:5174/payment/result
    ports: ["3000:3000"]
    volumes:
      - .:/app # monorepo: API cần cả packages/*
      - api-node-modules:/app/node_modules

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -w @airrest/web -- --host 0.0.0.0 --port 5173"
    ports: ["5174:5173"]
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules

volumes:
  pg-data:
  api-node-modules:
  web-node-modules:
