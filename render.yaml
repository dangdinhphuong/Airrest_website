# Render Blueprint: New + -> Blueprint, chọn repo này. Giả định Airrest_website/ là GỐC của repo
# (nếu nằm trong repo lớn hơn, đặt rootDir cho từng service).
services:
  - type: web
    name: airrest-api
    runtime: node
    plan: free # free: ngủ sau ~15 phút không có request -> IPN SePay có thể trễ; dùng gói trả phí khi chạy thật
    buildCommand: npm ci && npm run db:migrate -w @airrest/backend # áp schema mỗi lần deploy (chạy lại an toàn)
    startCommand: npm run start -w @airrest/backend
    healthCheckPath: /health
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false } # Supabase Session pooler, tự dán trên dashboard
      - { key: JWT_SECRET, generateValue: true }
      - { key: DATA_ENC_KEY, generateValue: true } # đừng đổi sau khi đã có dữ liệu mã hóa
      - { key: CORS_ORIGINS, sync: false } # URL của airrest-web, ví dụ https://airrest-web.onrender.com
      - { key: R2_ACCOUNT_ID, sync: false }
      - { key: R2_ACCESS_KEY_ID, sync: false }
      - { key: R2_SECRET_ACCESS_KEY, sync: false }
      - { key: R2_BUCKET, value: "airrest-media" }
      - { key: R2_PUBLIC_BASE_URL, sync: false }
      - { key: SHUTTLE_DISPATCH_SWEEP_SEC, value: "60" } # quét điều phối xe, 0 = tắt
      - { key: SHUTTLE_DISPATCH_LEAD_MIN, value: "30" }
      - { key: SHUTTLE_VEHICLE_WINDOW_MIN, value: "90" }
      - { key: SHUTTLE_EXTERNAL_OVERDUE_MIN, value: "10" }
      - { key: SHUTTLE_CALL_NOW_MIN, value: "15" }
      - { key: SHUTTLE_SIM_ENABLED, value: "true" } # mô phỏng vị trí xe (chuyến của khách sạn)
      - { key: SHUTTLE_SIM_AUTO, value: "false" } # production: tài xế tự bấm; bật "true" chỉ để demo
      - { key: SHUTTLE_SIM_SPEED_KMH, value: "40" }
      - { key: SHUTTLE_SIM_TIME_SCALE, value: "1" }
      - { key: SHUTTLE_SIM_TICK_MS, value: "2000" }
      - { key: OSRM_URL, value: "https://router.project-osrm.org" }
      - { key: EXTERNAL_RIDE_LINK_HOSTS, value: "grab.com,xanhsm.com" } # PHẢI kiểm tra tên miền chia sẻ thực tế của Grab/Xanh SM
      - { key: SEPAY_ENABLED, value: "true" }
      - { key: SEPAY_MODE, value: live }
      - { key: SEPAY_MERCHANT_ID, sync: false }
      - { key: SEPAY_SECRET_KEY, sync: false } # khóa merchant: ký form checkout
      - { key: SEPAY_IPN_SECRET, sync: false } # khóa IPN: giống giá trị khai báo ở SePay (Cổng thanh toán > Cấu hình > IPN, xác thực SECRET_KEY)
      - { key: SEPAY_RETURN_URL, value: "https://airrest-web.onrender.com/payment/result" } # https://<airrest-web>.onrender.com/payment/result
      - { key: SEPAY_IPN_URL, value: "https://airrest-api.onrender.com/v1/payments/sepay/ipn" } # https://airrest-api.onrender.com/v1/payments/sepay/ipn (khai báo URL này ở SePay)

  - type: web
    name: airrest-web
    runtime: static
    buildCommand: npm ci && npm run build -w @airrest/web
    staticPublishPath: apps/web/dist
    envVars:
      - { key: VITE_API_BASE_URL, sync: false } # URL của airrest-api, ví dụ https://airrest-api.onrender.com (Vite nhúng lúc build: đổi thì phải deploy lại)
    routes:
      - { type: rewrite, source: /*, destination: /index.html } # SPA